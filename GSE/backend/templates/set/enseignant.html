{% load static %}
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DREFC:  enseignant</title>
    <!-- Favicons -->
    <link href="{% static 'img/favicon.png' %}" rel="icon" />
    <link
      href="{% static 'img/apple-touch-icon.png' %}"
      rel="apple-touch-icon"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />
    <link
      href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}"
      rel="stylesheet"
    />

    <link href=" {% static 'style.css' %}" rel="stylesheet" />
  </head>

<body>

  <div id="header"></div>

<div id="sidebar"></div>
  <main id="main" class="main">

    <div class="pagetitle">
      <h1> enseignant</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item"><a href="{% url 'enseignants' %}">Enseignants</a></li>
          <li class="breadcrumb-item active"> enseignant</li>
        </ol>
      </nav>
    </div>

    <section class="section">
      <div class="row container-sm  gy-2 gx-3 align-items-center">
          <div class=" card  ">
            <div class="card-body">
              <h5 class="card-title"> enseignant: </h5>
              {% if msg  %}
              <div class="alert alert-success"  role="alert">
                {{msg}}
             </div>
              {% endif %}
              <form method="POST" action="{% url 'enseignant' data.matriculeEns %}">
                {% csrf_token %}
                <div class="row mb-3">
                  <label  class="col-sm-2 col-form-label">Matricule</label>
                  <div class="col-sm-10">
                    <input disabled value="{{data.matriculeEns}}" type="number" required name="mat" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label  class="col-sm-2 col-form-label">Nom</label>
                  <div class="col-sm-10">
                    <input type="text" value="{{data.nomEnseignant}}"  required name="nom" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label  class="col-sm-2 col-form-label">Prénom</label>
                  <div class="col-sm-10">
                    <input type="text" value="{{data.prenomEnseignant}}" required name="prenom" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                    <label  class="col-sm-2 col-form-label">Département</label>
                    <div class="col-sm-10">
                      <input type="text" value="{{data.département}}" required name="dep" class="form-control">
                    </div>
                  </div>
              
                </div>
              

                <div class="row mb-3">
                  <label  class="col-sm-2 col-form-label">Grade</label>
                  <div class="col-sm-10">
                    <select name="grade" class="form-select" >
                      <option value="{{data.grade}}" selected> {{data.grade}} </option>
                      <option  value="maître assistant B">maître assistant B</option>
                      <option value="maître assistant A">maître assistant A</option>
                      <option value="maître  conférence B">maître conférence B</option>
                      <option value="maître conférence A">maître conférence A</option>
                      <option value="proffesseur">Proffesseur </option>
                    </select>
                  </div>
                </div>

                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label"></label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary"> mettre à jour l'etudiant</button>
                  </div>
                </div>

              </form>
            </div>
          </div>

      </div>
    </section>

  </main>

<div id="footer"></div>
  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <script src="{% static 'render.js' %}"></script>
  <script src="{% static 'main.js' %}"></script>

</body>

</html>
